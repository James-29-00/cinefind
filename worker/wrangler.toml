name = "cinefind-omniroute"
main = "worker.js"
compatibility_date = "2026-08-23"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "51a458a52bc647f386976bbcaf83c881"

[[kv_namespaces]]
binding = "SEARCH_CACHE"
id = "98e86250456d40be8e7c546966e171d1"

[[kv_namespaces]]
binding = "STATS_KV"
id = "e6eb5a36e2974e4382f99530a6f2490a"

[[d1_databases]]
binding = "LINKS_DB"
database_name = "cinefind-catalog"
database_id = "5d8cf44a-fe6e-412d-a8f7-566c26ebf21c"

[vars]
OMNIROUTE_URL = "https://omniroute-server-sx66.onrender.com"
OMNIROUTE_MODEL = "auto"
ALERT_EMAIL_FROM = "onboarding@resend.dev"
ALERT_EMAIL_TO = "manio.james.g.5588@gmail.com"

[triggers]
# "*/10 * * * *" — OmniRoute keep-alive ping (existing)
# "0 3 * * *"    — daily D1 link-rot re-verification sweep (reverifyStaleLinks)
crons = ["*/10 * * * *", "0 3 * * *"]
