name: CineFind Link Checker

on:
  schedule:
    # Every 6 hours. Well under the Worker's 2-day HEARTBEAT_STALE_MS, so
    # normally the Worker's own emergency backup sweep never has to take
    # over — it only kicks in if this workflow itself stops running
    # (e.g. GitHub disables it, or every run starts failing).
    - cron: '0 */6 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run checker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CHECKER_SECRET: ${{ secrets.CHECKER_SECRET }}
        run: node scripts/link-checker.js
