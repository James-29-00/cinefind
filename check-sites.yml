name: Daily Site Status Check

on:
  schedule:
    # Runs every day at 00:00 UTC (adjust if you want a specific PH time —
    # PH is UTC+8, so 00:00 UTC = 8:00 AM Philippine time)
    - cron: '0 0 * * *'
  workflow_dispatch: {} # lets you manually trigger it from the Actions tab too

permissions:
  contents: write

jobs:
  check-sites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run site checker
        run: node scripts/check-sites.js

      - name: Commit updated status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "Auto-update site status [skip ci]"
          git push
