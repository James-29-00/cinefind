<style>
  /* Standard visually-hidden utility — content stays in the accessibility
     tree (screen readers) but takes no visual space and doesn't affect
     any layout, sizing, or card styling anywhere else on the page. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  :root {
    /* Radius scale — the file currently has ~15 different border-radius
       values scattered across components (4/5/6/8/9/10/12/14/16/18/20/24/
       30/999/9999px), which is design-system debt: no clear "family" of
       shapes. These vars define a standard scale for new/edited work to
       adopt going forward. NOT retroactively applied to existing elements
       in this pass — doing that blindly across ~50 scattered occurrences
       risked subtly changing the look of components (including the card)
       with no easy way to verify each one stayed correct. Safer as an
       opt-in foundation than a risky blanket find-replace.
       sm=chips/small controls, md=buttons/inputs, lg=cards/panels,
       xl=large modals/sheets, pill=fully-rounded (badges/toggle pills). */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-pill: 999px;
    /* Light Mode Colors */
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #ffffff0f;
    --accent: #e63946;
    --accent2: #ff6b6b;
    --gold: #ffd166;
    --text: #f0f0f5;
    --muted: #9494b5;
    --green: #06d6a0;
    /* Fixed bright pair for the status-dot badge icon only (see
       statusDotColor()) — that icon always sits on the same near-black
       circle (.status-dot-mini's background never changes with theme),
       so unlike --green/--gold text it must NOT follow light-mode's
       darkened-for-text-contrast values, or it reads as invisible/black
       against that dark circle. */
    --status-green: #06d6a0;
    --status-gold: #ffd166;
    /* Per-brand logo text colors, used by several sites' custom logoHtml
       (e.g. "Studios" in TBA Studios, "Cine" in CineWhale). These were
       hardcoded as inline style="color:#hex" — fine on the dark card they
       were tuned for, but every one of them measured well under WCAG AA's
       4.5:1 against the new light pastel cards (as low as ~1.45:1) once
       Light Mode shipped. Inline styles can't be overridden by a CSS
       class, so these became variables instead — dark-mode value here,
       darkened light-mode value in the body.light-mode block below. */
    --brand-teal: #06d6a0;
    --brand-red: #ef4444;
    --brand-purple: #a855f7;
    --brand-cyan: #00c2b8;
    --brand-orange: #ff8a3d;
    --brand-coral: #ff7a59;
    --brand-pink: #ff4d8f;
    --brand-orangered: #f4522b;
    --brand-blue: #4da6ff;
    --brand-skyblue: #1e9edb;

    /* Spacing scale (4px base) — card padding/gap/radius pull from this
       instead of one-off numbers, so the grid reads as intentional rather
       than assorted. Existing values that already matched (e.g. 16px,
       32px) are untouched; only the odd-ones-out (14px, 15px, 130px...)
       were nudged onto this scale. */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-6: 24px;
    --sp-8: 32px;
    --sp-12: 48px;
    --sp-16: 64px;

    /* Type scale (16px root) — same idea for font-size. Card labels below
       now pick the nearest step instead of an arbitrary .95rem/.88rem/.7rem
       mix. */
    --fs-xs: .75rem;   /* 12px */
    --fs-info: .8125rem; /* 13px — minimum for real info (site notes, badges,
                             status text), never smaller even where the old
                             12px --fs-xs scale step would otherwise apply */
    --fs-sm: .875rem;  /* 14px */
    --fs-base: 1rem;   /* 16px */
    --fs-lg: 1.25rem;  /* 20px */
    --fs-xl: 1.75rem;  /* 28px */
  }

  /* Dark Mode (Default) */
  body.dark-mode {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #ffffff0f;
    --text: #f0f0f5;
    --muted: #9494b5;
  }

  /* Light Mode */
  /* Rebuilt as a warm, dimmed "paper" palette instead of a bright cool-white
     one. A near-white, blue-leaning background (the original #f8f9fa/#eef0f3
     attempts) is high-luminance and reads as glary/harsh, especially on
     phone screens — similar to why reading apps (Kindle "sepia", iOS
     Reader) shift toward warm cream tones instead of stark white for
     comfortable extended viewing. This palette lowers overall brightness
     and adds warmth throughout, not just glow effects.
     --muted/--text: warm near-black/warm gray instead of the cool navy
     originals — softer against a warm background, still clears WCAG AA
     (--text ~13:1, --muted ~4.7:1 against --bg).
     --gold: kept from the earlier pass — dark amber still reads clearly
     against this warmer, slightly dimmer background. */
  body.light-mode {
    --bg: #d9d3c5;
    --surface: #e8e2d3;
    --card: #e8e2d3;
    --border: #00000024;
    --text: #262420;
    /* Darkened slightly from the initial #656055/#96700a/#0b6b40 — those
       measured 4.19:1, 3.05:1, and 4.41:1 against --bg, all under WCAG AA's
       4.5:1 minimum for normal-size text (most usages here are .7–.9rem
       labels, too small to qualify for the relaxed large-text threshold).
       These land at 4.5:1+ with a barely-perceptible hue shift. */
    --muted: #5f5a50;
    --gold: #755708;
    --green: #0b693f;
  }

  /* ===== Color Themes ===== */
  /* Three full themes cycled via the moon button — Crimson (default) is the
     original look; Cyber Neon swaps in a cyan/starfield aesthetic; Galaxy
     swaps in a pink/purple nebula aesthetic. All three set the full color
     palette (not just --accent) since each changes the background too. */
  body, body.theme-crimson {
    --accent: #e63946; --accent2: #ff6b6b; --bg-glow-rgb: 230,57,70;
  }
  body.theme-cyber {
    --bg: #05060f; --surface: #0a0d1f; --card: #0d1226;
    --border: rgba(34,229,229,.35);
    --text: #eef2ff; --muted: #8b93b8;
    --accent: #22e5e5; --accent2: #6df0ff; --bg-glow-rgb: 34,229,229;
  }
  body.theme-galaxy {
    --bg: #120a1e; --surface: #1a1028; --card: #1c1230;
    --border: #ff5fa233;
    --text: #f5f0fa; --muted: #c3b3dc;
    --accent: #ff5fa2; --accent2: #ff8fc4; --gold: #ffcf5c; --bg-glow-rgb: 255,95,162;
  }
  /* --accent2 (bright coral, used for genre chips/badges, the theme-toggle
     icon, favorite star, and bolded tip text) needs a darker value in
     Light Mode — #ff6b6b measures only ~1.86:1 against the light --bg,
     badly failing WCAG AA. This previously lived in the plain
     `body.light-mode` block above, but that has the SAME specificity as
     `body.theme-crimson` right above (both are one-element+one-class
     selectors) — with equal specificity, source order decides, and the
     theme rule comes later, so it silently won every time and the fix
     never actually applied. Scoping this as a compound
     `body.light-mode.theme-crimson` selector (two classes) gives it
     higher specificity so it reliably wins regardless of order. */
  /* Light Mode uses a darker, WCAG-AA-safe red instead of the original
     bright Crimson red (#e63946, which only measures ~1.86:1 against this
     warm --bg — badly failing accessibility) or the earlier gold/amber
     substitute. Both --accent and --accent2 are darkened reds tuned to
     clear 4.5:1+ against --bg (#d9d3c5) — #a80f0f measures ~5.14:1,
     #a52a25 ~4.76:1 — so Light Mode stays on-brand (matches the red
     wordmark/dark-theme accent) instead of reading as a different app.
     Overrides `body.theme-crimson`'s red via the same two-class
     `body.light-mode.theme-crimson` compound selector used elsewhere here
     for the specificity reasons explained above. */
  body.light-mode.theme-crimson {
    --accent: #a80f0f; --accent2: #a52a25; --bg-glow-rgb: 168,15,15;
  }
  /* Darkened (same hue/saturation, reduced lightness) versions of each
     --brand-* color, tuned to hit 4.5:1+ against the lightest of the
     three pastel card tones. No theme block ever sets these variables
     (unlike --accent2), so plain body.light-mode is sufficient here —
     no specificity fight to worry about. */
  body.light-mode {
    --brand-teal: #037356;
    --brand-red: #c61111;
    --brand-purple: #8a1bf4;
    --brand-cyan: #00706b;
    --brand-orange: #a34100;
    --brand-coral: #bf2600;
    --brand-pink: #c7004a;
    --brand-orangered: #ba2c0a;
    --brand-blue: #005fbd;
    --brand-skyblue: #146a93;
  }
  /* Starfield + nebula glow, only rendered in Cyber Neon mode. Pure CSS
     (radial gradients / SVG data-URI), so no extra image requests. */
  body.theme-cyber .bg-glow {
    background: radial-gradient(ellipse, rgba(34,229,229,.15) 0%, rgba(45,165,229,.08) 40%, transparent 70%);
    width: 700px; height: 500px;
  }
  .starfield {
    display: none;
    /* Absolute (not fixed) and capped in height so the dots only live
       behind the hero/header — logo, tagline, search bar — and scroll
       away with the page instead of showing through every card below.
       Trimmed from 560px — that was tall enough to bleed into the top rows
       of the sites grid, distracting from the cards themselves. */
    position: absolute; top: 0; left: 0; right: 0; height: 380px;
    overflow: hidden; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1.5px 1.5px at 20% 15%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 75% 8%, #fff 100%, transparent),
      radial-gradient(1px 1px at 45% 25%, #fff 100%, transparent),
      radial-gradient(2px 2px at 90% 30%, #fff 100%, transparent),
      radial-gradient(1px 1px at 10% 45%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 60% 12%, #fff 100%, transparent),
      radial-gradient(1px 1px at 30% 60%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 85% 55%, #fff 100%, transparent),
      radial-gradient(1px 1px at 15% 75%, #fff 100%, transparent),
      radial-gradient(2px 2px at 65% 80%, #fff 100%, transparent),
      radial-gradient(1px 1px at 95% 70%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 40% 90%, #fff 100%, transparent);
    opacity: .28;
  }
  body.theme-cyber .starfield { display: block; }

  body.theme-cyber .site-card > * { position: relative; z-index: 1; }
  body.theme-cyber .site-card:hover {
    border-color: var(--accent); box-shadow: 0 0 24px rgba(34,229,229,.35);
  }
  body.theme-cyber .search-box,
  body.theme-cyber .search-wrap > div:first-child {
    box-shadow: 0 0 24px rgba(34,229,229,.25);
  }
  body.theme-cyber .logo span {
    filter: drop-shadow(0 0 12px rgba(34,229,229,.6));
  }

  /* Nebula glow + twinkling stars, Galaxy theme only */
  body.theme-galaxy .bg-glow {
    background: radial-gradient(ellipse, rgba(255,95,162,.2) 0%, rgba(167,139,250,.12) 40%, transparent 70%);
    width: 700px; height: 500px;
  }
  body.theme-galaxy .starfield {
    display: block;
    opacity: .28;
    animation: galaxyTwinkle 5s ease-in-out infinite alternate;
  }
  @keyframes galaxyTwinkle { from { opacity: .18; } to { opacity: .32; } }
  body.theme-galaxy .site-card:hover {
    border-color: var(--accent); box-shadow: 0 0 24px rgba(255,95,162,.35);
  }
  body.theme-galaxy .search-box,
  body.theme-galaxy .search-wrap > div:first-child {
    box-shadow: 0 0 24px rgba(255,95,162,.25);
  }
  body.theme-galaxy .logo span {
    filter: drop-shadow(0 0 12px rgba(255,95,162,.6));
  }

  /* My Favorites star — follows the active theme's accent color + glow */
  .fav-star-icon {
    color: var(--accent);
    filter: drop-shadow(0 0 5px rgba(var(--bg-glow-rgb), .75));
    transition: color .3s, filter .3s;
  }
  /* var(--accent) only measures ~2.82:1 against Light Mode's warm --bg,
     under WCAG 1.4.11's 3:1 floor for icons. Reuses the already-fixed
     --accent2 (4.87:1) rather than a new color. */
  body.light-mode .fav-star-icon { color: var(--accent2); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background .3s, color .3s;
    /* Base readable line-height for body copy (paragraphs, disclaimers,
       descriptions). Short UI labels/buttons already set their own
       line-height: 1 explicitly, so they're unaffected by this default. */
    line-height: 1.5;
  }

  /* ===== Accessibility: global keyboard-focus fallback ===== */
  /* Elements that already define their own :focus-visible style (search
     input, pills, pin icons, etc.) keep using that. This is just a safety
     net for every other button/link/input in the app so keyboard users
     always get a visible focus ring, not just mouse-hover states. */
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: .4;
  }

  .bg-glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--bg-glow-rgb, 230,57,70),.12) 0%, transparent 70%);
    top: -200px; left: 50%; transform: translateX(-50%);
    pointer-events: none; z-index: 0;
  }

  .wrapper { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 0 20px 80px; }

  header { text-align: center; padding: 20px 0 var(--sp-3); position: relative; }
  .header-top { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: var(--sp-6); }
  .logo {
    /* Switched from 'Bebas Neue' — that font is an all-caps-only display
       face with no distinct lowercase glyphs, so "Cine"+"Find" always
       rendered visually identical to "CINEFIND" no matter the size,
       color, or theme (the actual root cause of the "always looks like
       caps" issue — not a sizing/contrast problem as first suspected).
       Space Grotesk (already loaded at 700 weight for other UI bits)
       has real lowercase forms, so the wordmark now genuinely reads as
       mixed-case "CineFind". */
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    /* Smoother fluid scaling: a fixed rem base plus a gentler vw increment,
       instead of a steep straight vw value. This avoids the sudden crowded
       look on ~360-400px phones where 10vw was already near the clamp
       floor, and keeps the size change gradual across breakpoints.
       Max size trimmed from 5rem to 4.5rem — the previous size crowded
       the space above the search bar on larger phones; this keeps the
       wordmark commanding without dominating the whole first screen. */
    font-size: clamp(2.6rem, 1.9rem + 3.2vw, 4.5rem);
    /* Tighter, slightly negative tracking reads as a deliberate logotype
       rather than plain bold text — standard practice for large display
       wordmarks set in a geometric sans like Space Grotesk. */
    letter-spacing: clamp(-.03em, -.035em + .03vw, -.02em);
    line-height: 1;
    white-space: nowrap;
    /* Flat solid white for "Cine" instead of a diagonal gradient — at
       small sizes the gradient only had a few characters' worth of pixels
       to blend across, and the hard handoff into the solid-color "Find"
       span made the join look blotchy/uneven. Two flat colors read
       cleanly at any size and stay consistent across all theme accents. */
    color: #fff;
    flex: 1;
  }
  .logo span { color: var(--accent); font-weight: 800; }
  /* Reset native button chrome now that .logo is a <button> (was a <div>) —
     .logo above already sets all the text styling (family/size/weight/
     color/etc), so this only strips button-specific defaults, no font
     shorthand here (that would reset .logo's properties via cascade order). */
  .logo-btn {
    background: none; border: none; padding: 0; margin: 0;
    cursor: pointer; text-align: inherit; display: inline-block;
  }
  body.theme-crimson .logo span {
    filter: drop-shadow(0 0 12px rgba(230,57,70,.6));
  }
  /* The wordmark's first half ("Cine") fades from white into the accent
     color — built for a dark background. On Light Mode that white start
     point is nearly invisible against the light page background.
     A gradient blend was tried here first, but both endpoints (dark text
     + darkened-for-contrast red) are low-lightness colors, so the blend
     just reads as one uniform dark blob instead of a crisp brand mark —
     losing the sharp two-tone pop the dark-mode version has. Simpler and
     cleaner: go solid, same strategy as dark mode (solid white "Cine" +
     solid accent-red "Find"), just swapping white for --text so "Cine"
     still has strong contrast on the light background. */
  body.light-mode .logo {
    color: var(--text);
  }
  /* Glow effects below (ambient background circle, button halos, text
     drop-shadow) were all tuned for a near-black background, where a
     saturated, low-opacity red haze reads as a subtle moody vignette. On a
     light/white background the exact same glow shows up as a garish pink
     "stain" and glaring halos instead — visibly uncomfortable rather than
     atmospheric. These light-mode overrides tone them down rather than
     removing them outright, so Light Mode still feels like the same brand,
     just softened for a bright surface. */
  body.light-mode .bg-glow {
    opacity: 0;
  }
  body.light-mode .theme-toggle {
    box-shadow: 0 0 6px rgba(var(--bg-glow-rgb),.4);
    /* Same ~2.82:1-vs-3:1 icon contrast issue as .fav-star-icon above —
       border+icon both reuse --accent2 (4.87:1) here for the same reason. */
    border-color: var(--accent2); color: var(--accent2);
  }
  body.light-mode .theme-toggle:hover {
    box-shadow: 0 0 10px rgba(var(--bg-glow-rgb),.5);
  }
  body.light-mode.theme-crimson .logo span {
    filter: drop-shadow(0 0 4px rgba(230,57,70,.3));
  }
  /* Remaining spots that assumed a dark background and would otherwise be
     hard to see or read on Light Mode: */
  /* "1 online now" badge text was a pale mint (#b8ffcf) tuned for a dark
     pill — nearly invisible against a light background. Darker green here
     keeps the same "online/live" meaning at readable contrast. */
  body.light-mode .online-badge {
    color: #1a7a42;
    -webkit-text-fill-color: #1a7a42;
    background: rgba(34, 197, 94, .14);
    border-color: rgba(34, 197, 94, .5);
  }
  /* Category filter pills (Movie/K-Drama/Anime/etc.) used a pale gray text
     and dark border tuned for a dark background — both nearly disappear on
     Light Mode. */
  body.light-mode .filter-chip {
    border-color: var(--border);
    color: var(--muted);
  }
  body.light-mode .filter-select {
    border-color: var(--border);
  }
  /* "Popular searches" pill buttons — same pale-text-on-dark-border issue,
     including the ones reused inside the Report/About popups. */
  body.light-mode .pop-chip {
    border-color: var(--border);
    color: var(--muted);
  }
  /* Loading skeletons (poster shimmer, year badge, copy-link button) added a
     faint *white* highlight/overlay to stand out against a dark surface —
     on a light card that highlight is invisible, so these use a dark
     highlight instead so the loading state and controls stay visible. */
  body.light-mode .poster-shimmer {
    background: linear-gradient(90deg, var(--card) 25%, rgba(0,0,0,.06) 50%, var(--card) 75%);
    background-size: 200% 100%;
  }
  body.light-mode .poster-loading {
    background: linear-gradient(90deg, var(--surface) 25%, rgba(0,0,0,.08) 50%, var(--surface) 75%);
    background-size: 200% 100%;
  }
  body.light-mode .badge-year {
    background: rgba(0,0,0,.06);
  }
  /* Genre/rating badge tints were only tuned for the dark card (a faint
     colored wash reads clearly against near-black) — at the same low
     opacity on the light card they look weak/washed out instead of like
     a distinct pill. Slightly stronger tints here keep them readable as
     actual badges rather than near-invisible text with no chip shape. */
  body.light-mode .badge-genre {
    background: rgba(var(--bg-glow-rgb),.14);
  }
  body.light-mode .badge-rating {
    background: rgba(255,209,102,.22);
  }
  body.light-mode .copy-link-btn {
    background: rgba(0,0,0,.05);
  }
  body.light-mode .copy-link-btn:hover {
    background: rgba(var(--bg-glow-rgb),.12);
  }
  .tagline { font-size: .9rem; color: var(--muted); margin-top: var(--sp-1); letter-spacing: .08em; text-transform: uppercase; }

  /* Returning-visitor hero: on repeat visits the full-size logo + tagline
     eats a near-full screen before any content shows, which is pure
     friction for people who already know what CineFind is. The
     `hero-compact` class (added via a tiny inline script right after
     <body>, based on a "have they been here before" localStorage flag)
     shrinks the header so the site directory / search results are
     reachable with less scrolling — first-time visitors still get the
     full branded intro untouched. */
  body.hero-compact header { padding: 10px 0 14px; }
  /* Sized up from an earlier clamp(2rem, 6vw, 2.75rem) — at that smaller
     size, Bebas Neue's lowercase letters (which have no ascenders/
     descenders on "ine"/"ind") sit close enough in height to the
     uppercase letters that the whole wordmark reads as if it were typed
     in all-caps, even though the markup is still "Cine"+"Find" mixed
     case. Keeping the compact size a bit larger preserves the visible
     cap-height vs. x-height difference so it still reads as CineFind. */
  body.hero-compact .logo { font-size: clamp(2.5rem, 6vw, 3.25rem); }
  body.hero-compact .tagline { display: none; }

  /* Online-now live badge — a secondary trust signal, so it lives in the
     top corner (beside the theme toggle) rather than next to the wordmark.
     Keeping it out of the .logo row lets the brand mark stand alone as the
     one thing that grabs attention first. */
  .online-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: .72rem; font-weight: 600; letter-spacing: .02em;
    color: #b8ffcf;
    background: rgba(34, 197, 94, .12);
    border: 1px solid rgba(34, 197, 94, .35);
    /* Padding bumped up (was 4px 10px 4px 8px) — at the old size this pill
       sat noticeably shorter than the 45px circular buttons beside it in
       the header row, reading as a mismatched, unrelated element rather
       than part of the same row. */
    padding: 10px 14px 10px 10px;
    border-radius: 999px;
    vertical-align: middle;
    margin-right: auto;
    -webkit-text-fill-color: #b8ffcf;
  }
  .online-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
    animation: online-pulse 1.6s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes online-pulse {
    0%   { transform: scale(.85); box-shadow: 0 0 4px rgba(34,197,94,.6); }
    50%  { transform: scale(1.15); box-shadow: 0 0 10px rgba(34,197,94,.9); }
    100% { transform: scale(.85); box-shadow: 0 0 4px rgba(34,197,94,.6); }
  }
  @media (prefers-reduced-motion: reduce) {
    .online-dot { animation: none; }
  }

  .safety-tip {
    max-width: 420px; margin: 14px auto 0;
    display: flex; align-items: center; gap: 7px;
    font-size: .72rem; color: var(--muted); line-height: 1.5;
  }
  .safety-tip .tip-icon { font-size: .85rem; opacity: .7; flex-shrink: 0; }
  /* Same ~2.82:1-vs-4.5:1 text contrast issue as elsewhere — this is an
     actual link (not just decorative text), so the stricter text-contrast
     floor applies. Reuses --accent2 (4.87:1). */
  body.light-mode .brave-dl-link { color: var(--accent2); }
  .safety-tip strong { color: var(--accent2); font-weight: 600; }
  .safety-tip .tip-close {
    background: none; border: none; color: var(--muted); opacity: .6;
    cursor: pointer; font-size: .9rem; line-height: 1; padding: 2px 4px;
    flex-shrink: 0; margin-left: auto; align-self: flex-start;
  }
  .safety-tip .tip-close:hover { opacity: 1; color: var(--text); }

  /* iOS "Add to Home Screen" fallback banner — see showIosInstallBannerIfNeeded() */
  #ios-install-banner {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 500;
    max-width: 460px; margin: 0 auto;
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 8px 28px rgba(0,0,0,.45);
    animation: slideUpFade .3s ease;
  }
  #ios-install-banner .ios-banner-icon { font-size: 1.2rem; flex-shrink: 0; }
  #ios-install-banner .ios-banner-text { font-size: .8rem; color: var(--text); line-height: 1.4; flex: 1; }
  #ios-install-banner .ios-banner-text strong { color: var(--accent2); }
  #ios-install-banner .ios-banner-close {
    background: none; border: none; color: var(--muted); opacity: .7;
    cursor: pointer; font-size: 1rem; line-height: 1; padding: 4px; flex-shrink: 0;
  }
  #ios-install-banner .ios-banner-close:hover { opacity: 1; color: var(--text); }
  @keyframes slideUpFade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* Moon Button — icon color/glow matches the active theme's accent:
     crimson red on the default theme, cyan on Cyber Neon. Uses `color` so
     the inline SVG moon (fill="currentColor") follows it automatically. */
  .theme-toggle {
    background: var(--card); border: 2px solid var(--accent);
    color: var(--accent);
    border-radius: 50%; width: 45px; height: 45px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .3s;
    box-shadow: 0 0 10px var(--accent);
  }
  .theme-toggle:hover { transform: scale(1.1); box-shadow: 0 0 18px var(--accent), 0 0 6px var(--accent); }

  .search-wrap { position: relative; margin: var(--sp-4) 0 var(--sp-3); }
  .search-wrap input {
    width: 100%; padding: 18px 96px 18px 22px;
    /* Dialed back from an earlier pass that overcorrected — 22px padding +
       2px border + a heavy shadow made the search bar visually louder than
       everything else on the page instead of just "clearly the primary
       action." This keeps a slightly bolder border/shadow than the
       original 1.5px-no-shadow version so it still reads as emphasized,
       without ballooning in physical size. */
    background: var(--surface); border: 1.5px solid rgba(var(--bg-glow-rgb),.3);
    border-radius: 14px; font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem; color: var(--text); outline: none;
    box-shadow: 0 4px 14px rgba(var(--bg-glow-rgb),.1);
    transition: border-color .2s, box-shadow .2s;
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--bg-glow-rgb),.15); }

  .suggestions-box {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
    overflow: hidden; z-index: 20; max-height: 320px; overflow-y: auto;
    box-shadow: 0 12px 30px rgba(0,0,0,.4); display: none;
  }
  .suggestions-box.open { display: block; }
  .suggestion-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    cursor: pointer; transition: background .15s; border-bottom: 1px solid var(--border);
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover, .suggestion-item.active { background: rgba(var(--bg-glow-rgb),.1); }
  .suggestion-poster { width: 32px; height: 46px; border-radius: 5px; background: var(--surface); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: .9rem; overflow: hidden; }
  .suggestion-poster img { width: 100%; height: 100%; object-fit: cover; }
  .suggestion-text { flex: 1; min-width: 0; }
  .suggestion-title { font-size: .85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggestion-meta { font-size: .7rem; color: var(--muted); }
  .search-btn {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    background: var(--accent); border: none; border-radius: 10px;
    width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .2s, transform .15s; font-size: 18px;
  }
  .search-btn:hover { background: var(--accent2); transform: translateY(-50%) scale(1.05); }

  .filters { display: flex; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 28px; align-items: center; }
  .filter-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filter-label { font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .filter-select {
    padding: 6px 12px; border-radius: 8px; border: 1px solid #3A3448;
    background: var(--card); color: var(--text); font-family: 'Space Grotesk', sans-serif;
    font-size: .8rem; cursor: pointer; transition: all .2s;
    outline: none;
  }
  .filter-select:focus, .filter-select:hover { border-color: var(--accent); }
  .filter-chip {
    padding: 6px 14px; border-radius: 20px; border: 1px solid #3A3448;
    background: transparent; color: #C9C6D6; font-family: 'Space Grotesk', sans-serif;
    font-size: .8rem; cursor: pointer; transition: all .2s;
  }
  .filter-chip:hover, .filter-chip.active { border-color: var(--accent); color: var(--accent2); background: rgba(var(--bg-glow-rgb),.08); }
  .filter-chip.fav-chip { color: var(--accent2); border-color: rgba(var(--bg-glow-rgb),.35); }
  .filter-chip.fav-chip:hover { background: rgba(var(--bg-glow-rgb),.1); }
  .fav-quick-link {
    /* Was plain text with no background/border — floated on the page with
       nothing visually anchoring it to the search bar above or the site
       list below. A light pill container (same language as the app's other
       chips/pills) gives it a clear, intentional identity instead. */
    background: rgba(var(--bg-glow-rgb),.08);
    border: 1px solid rgba(var(--bg-glow-rgb),.25);
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif; font-size: .8rem;
    color: var(--muted); padding: 7px 14px 7px 12px;
    display: inline-flex; align-items: center; gap: 5px;
    transition: color .2s, border-color .2s, background .2s;
  }
  .fav-quick-link:hover { color: var(--accent2); border-color: var(--accent2); background: rgba(var(--bg-glow-rgb),.14); }

  /* ===== Genre pill chips (gradient border trick) ===== */
  .pill-container {
    display: flex; align-items: center; justify-content: flex-start;
    gap: 8px; padding: 12px 16px;
    overflow-x: auto; scrollbar-width: none;
  }
  .pill-container::-webkit-scrollbar { display: none; }
  .genre-pill {
    background-color: transparent;
    color: var(--muted);
    font-size: 13px; font-weight: 500;
    padding: 6px 16px;
    border-radius: 9999px;
    border: 1.5px solid transparent;
    cursor: pointer; white-space: nowrap;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .genre-pill:hover { opacity: 0.85; transform: translateY(-1px); }
  .dual-gradient-pill {
    background-color: transparent;
    color: var(--muted);
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 9999px;
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, color .15s ease, background-image .15s ease;
    /* Was a colorful gradient border on EVERY chip, active or not — with
       "My Favorites", the Sites/Genres tabs, and 4+ filter chips all doing
       this at once, the whole row read as one glowing blob with no clear
       "this one is selected." Unselected chips now use a plain neutral
       border; the gradient only appears once a chip is actually active
       (see .active below), so color = selection, not decoration. */
  }
  .dual-gradient-pill.active {
    color: var(--text); font-weight: 600;
    border: 1.5px solid transparent;
    background-image:
      linear-gradient(var(--card), var(--card)),
      linear-gradient(135deg, rgba(var(--bg-glow-rgb),.55) 0%, var(--accent2) 100%);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    /* Ring uses the theme accent (not a flat white) so the "selected" state
       reads as an emphasized version of the same gradient-pill family
       instead of a visually different component. */
    box-shadow: 0 0 0 1.5px var(--accent);
  }
  .dual-gradient-pill.active::before {
    content: "✓";
    display: inline-block;
    margin-right: 5px;
    font-weight: 700;
  }
  .dual-gradient-pill:focus-visible,
  .genre-pill:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }
  /* Light Mode's --bg is a warm cream, not the near-black every theme's
     --accent was tuned for — the same fully-saturated accent that reads as
     a crisp glow on dark backgrounds instead reads as a harsh, clashing
     ring against a pastel one. Softened here by blending toward --bg
     (same hue family, ~45% less saturated) rather than introducing a
     separate light-mode accent variable, so it still visibly matches
     whichever theme (Crimson/Cyber/Galaxy) is active. */
  body.light-mode .dual-gradient-pill.active {
    box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, var(--bg) 45%);
  }

  .genre-chip {
    padding: 9px 20px 9px 16px; border-radius: 24px; border: 1.5px solid var(--accent);
    background: transparent; color: var(--accent2); font-family: 'Space Grotesk', sans-serif;
    font-size: .8rem; font-weight: 600; cursor: pointer; transition: all .2s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .genre-chip:hover { background: rgba(var(--bg-glow-rgb),.1); transform: translateY(-1px); }
  /* The dark-mode border color (var(--accent), #e63946) only measures
     ~2.82:1 against Light Mode's warm --bg — just under WCAG 1.4.11's 3:1
     floor for UI component borders. Reusing the already-fixed --accent2
     (4.87:1) instead of introducing a new color keeps this consistent with
     the genre-chip text fix above. */
  body.light-mode .genre-chip { border-color: var(--accent2); }
  .genre-chip.active { background: var(--accent); color: #fff; }
  .genre-chip .icon { display: inline-flex; opacity: .7; flex-shrink: 0; }
  .genre-chip .icon svg { display: block; }

  #result-area { min-height: 200px; }

  .loading { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 60px 0; color: var(--muted); }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Skeleton loader (initial search result) ===== */
  /* Shows the shape of the movie header + site grid immediately, instead of
     a bare spinner, so the layout feels like it's "arriving" rather than
     the page looking frozen while the TMDB/AI calls are in flight. */
  .poster-shimmer {
    background: linear-gradient(90deg, var(--card) 25%, rgba(255,255,255,.06) 50%, var(--card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .movie-header {
    display: flex; gap: 20px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 24px; margin-bottom: 20px;
    animation: fadeUp .4s ease forwards;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: none; } }
  @keyframes posterShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .poster-loading {
    background: linear-gradient(90deg, var(--surface) 25%, rgba(255,255,255,.08) 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: posterShimmer 1.4s ease-in-out infinite;
  }
  .poster-img { opacity: 0; transition: opacity .3s ease; }
  .movie-poster {
    width: 90px; height: 130px; border-radius: 10px; background: var(--surface);
    display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
    flex-shrink: 0; border: 1px solid var(--border); overflow: hidden;
    position: relative;
  }
  .movie-poster img { width: 100%; height: 100%; object-fit: cover; }
  .fav-btn {
    position: absolute; top: 4px; right: 4px;
    background: rgba(0,0,0,.6); border: none; border-radius: 50%;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.2rem; transition: all .2s;
    z-index: 10;
  }
  /* Star now an SVG (was the ⭐ emoji glyph, which always renders the same
     fixed yellow regardless of state — only the background circle behind
     it changed color). Outline/unfilled by default, solid gold once
     favorited, so the state itself is visible on the icon, not just its
     backdrop. */
  .fav-btn svg { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linejoin: round; transition: fill .2s, stroke .2s; }
  .fav-btn.favorited svg { fill: #ffd23f; stroke: #ffd23f; }
  .fav-btn:hover { background: rgba(var(--bg-glow-rgb),.9); transform: scale(1.15); }
  .fav-btn.favorited { background: rgba(var(--bg-glow-rgb),.9); }

  .movie-info { flex: 1; }
  .movie-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; line-height: 1.2; }
  .movie-meta { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; font-size: .8rem; color: var(--muted); }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: var(--fs-info); font-weight: 600; }
  .badge-year { background: rgba(255,255,255,.07); color: var(--text); }
  .badge-genre { background: rgba(var(--bg-glow-rgb),.15); color: var(--accent2); }
  .badge-rating { background: rgba(255,209,102,.12); color: var(--gold); }
  .movie-desc { font-size: .85rem; color: var(--muted); line-height: 1.6; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .movie-desc.expanded { display: block; -webkit-line-clamp: unset; }
  .movie-desc-toggle { font-size: .8rem; color: var(--accent2); font-weight: 600; margin-top: 4px; cursor: pointer; background: none; border: none; padding: 0; }

  .section-label { font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .sites-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 20px; }
  /* Small label row between the "direct link" and "search inside site"
     groups of streaming sources — spans the full grid width so it reads as
     a section break rather than another card. Only rendered when a result
     actually has both kinds of sources. */
  .site-group-header {
    grid-column: 1 / -1;
    font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
    margin: 4px 0 -2px;
  }
  .site-group-header:not(:first-child) { margin-top: 10px; }

  .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .result-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; cursor: pointer; text-align: left;
    transition: border-color .2s, transform .2s, box-shadow .2s;
    animation: fadeUp .4s ease forwards; display: flex; flex-direction: column;
  }
  .result-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 30px rgba(var(--bg-glow-rgb),.15); }
  .result-card .result-poster { width: 100%; aspect-ratio: 2/3; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow: hidden; }
  .result-card .result-poster img { width: 100%; height: 100%; object-fit: cover; }
  .result-card .result-info { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
  .result-card .result-title { font-size: var(--fs-sm); font-weight: 600; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .result-card .result-meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: var(--fs-info); color: var(--muted); }
  .site-card {
    position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--sp-4);
    /* Same per-brand accent cue as the homepage grid cards — set inline per
       card from the matched site's logo color — just adapted to a left-edge
       stripe since this is a horizontal list row, not a square tile with a
       corner to tint. Keeps the two card styles feeling like one brand
       language instead of two unrelated components. */
    border-left: 3px solid var(--site-card-accent, var(--border));
    padding: var(--sp-4); text-decoration: none; color: var(--text);
    display: flex; align-items: center; gap: var(--sp-3);
    transition: border-color .2s, transform .2s, box-shadow .2s;
    animation: fadeUp .4s ease forwards;
    max-width: 100%; overflow: hidden;
  }
  .site-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(var(--bg-glow-rgb),.15); }
  .site-icon { width: 40px; height: 40px; border-radius: var(--sp-2); display: flex; align-items: center; justify-content: center; font-size: var(--fs-lg); flex-shrink: 0; }
  .site-logo-box {
    width: 64px; height: 48px; border-radius: var(--sp-2); flex-shrink: 0;
    background: #14141c; border: 1px solid rgba(255,255,255,.07);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  /* Search-results mini logo holder stays dark-toned for the same reason
     the homepage cards do (white logo text needs a dark surface) — but a
     stark pure-black #14141c box floating inside an otherwise light
     .site-card reads as a leftover dark-mode artifact. Coordinates it to
     the same dark-ink family used elsewhere in Light Mode instead. */
  body.light-mode .site-logo-box {
    background: #262420; border-color: rgba(0,0,0,.12);
    /* This box stays dark even in Light Mode (see comment above), so the
       logo text/icons inside it must stay white/light too — otherwise
       they'd inherit Light Mode's dark ink (meant for the light pastel
       homepage cards) and become invisible against this dark box. */
    --card-logo-ink: #fff;
    --card-logo-outline: #5b8def;
  }
  .site-logo-box > * { transform: scale(.62); transform-origin: center; }
  .site-info { flex: 1; min-width: 0; }
  .site-name { font-weight: 600; font-size: var(--fs-base); overflow-wrap: break-word; }
  .site-note { font-size: var(--fs-info); color: var(--muted); margin-top: 2px; overflow-wrap: break-word; }
  .site-free { font-size: var(--fs-info); font-weight: 700; color: var(--green); background: rgba(6,214,160,.1); padding: 3px var(--sp-2); border-radius: var(--sp-2); white-space: nowrap; }
  .arrow { color: var(--muted); font-size: var(--fs-xs); }
  .dir-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-4); margin-bottom: 20px; align-items: stretch; }

  /* Home tab bar (Sites / Genres) — item 10. Same pill language as the
     existing genre-pill/filter chips elsewhere on the page (rounded,
     bordered, accent-filled when active) so it reads as part of the same
     component family, not a new unrelated control. */
  .home-tab-bar {
    display: flex; gap: 3px; margin: var(--sp-6) 0 var(--sp-4);
    /* Rectangular segmented-control shape (not the fully-rounded 999px
       pill used for filter chips) — this is page-level navigation
       (switches the whole view), not a same-level filter refinement, so
       it deliberately reads as a different control type instead of just
       another oval in the row. A shared dark track behind both buttons
       (like iOS/Android segmented controls) instead of two separate
       floating pills. */
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 3px;
    position: relative; /* anchors .home-tab-indicator below */
  }
  /* Sliding active-state indicator — a single absolutely-positioned block
     that transform-slides between the two tab slots instead of each button
     independently toggling its own background. transform (not left/width)
     so the animation stays GPU-composited/smooth rather than triggering
     layout on every switch. Sized/positioned via JS (updateHomeTabIndicator)
     since it needs the real rendered width of the bar, which isn't knowable
     from CSS alone with a flexible/responsive layout. */
  .home-tab-indicator {
    position: absolute; top: 3px; bottom: 3px; left: 3px;
    width: calc(50% - 4.5px); border-radius: 9px;
    background: var(--surface); box-shadow: 0 0 0 1.5px var(--accent);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    z-index: 0;
  }
  .home-tab {
    flex: 1; padding: 9px 0; border-radius: 9px; border: none;
    background: transparent; color: var(--muted); font-family: 'Space Grotesk', sans-serif;
    font-size: var(--fs-sm); font-weight: 600; cursor: pointer; transition: color .2s;
    position: relative; z-index: 1; /* sits above .home-tab-indicator */
  }
  .home-tab.active { color: var(--text); font-weight: 700; }
  .home-tab:not(.active):hover { color: var(--text); }

  /* ===== Gradient-border directory card ===== */
  .gradient-card-wrapper {
    position: relative;
    border-radius: 16px;
    padding: 1px;
    /* content-visibility: auto + contain-intrinsic-size was here as a
       scroll-perf hack for off-screen cards, but on some Android Chrome/
       GPU combinations that pairing causes a rendering glitch — faint
       "ghost" text/cards bleeding through above their real position
       (reported by a user, e.g. a stray "Cineby" ghost near the header).
       Removed: with ~30 cards the perf gain was marginal anyway, and a
       visible rendering bug is worse than the jank it was preventing. */
    /* Per-brand accent (--card-accent, set inline per card from the site's
       logo color) tints one corner of the border so cards stay scannable
       by brand at a glance. Blended mostly with the theme accent (not just
       the neutral border) so raw brand hues (gold, green, etc.) don't fight
       the page's active palette — cards keep a subtle brand hint while
       staying visually cohesive across all three themes. Falls back to the
       theme accent for any site without one (e.g. admin-added custom sites). */
    background: linear-gradient(135deg, color-mix(in srgb, var(--card-accent, var(--border)) 15%, var(--border) 85%) 0%, var(--border) 60%);
    transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    animation: fadeUp .4s ease forwards;
    height: 100%;
  }
  .gradient-card-wrapper:hover {
    transform: translateY(-3px);
    background: linear-gradient(135deg, color-mix(in srgb, var(--card-accent, var(--accent)) 25%, var(--accent) 75%) 0%, rgba(var(--bg-glow-rgb),.45) 65%);
    /* Blur trimmed from 16px — with only 12px between cards on mobile, a
       wider glow was visually merging into the next card's glow instead of
       reading as one card lifting. */
    box-shadow: 0 0 9px color-mix(in srgb, var(--card-accent, var(--accent)) 15%, var(--accent) 85%);
  }
  .gradient-card-wrapper:active {
    transform: scale(.97);
    transition: transform .1s ease;
  }
  /* Same fix as the pill active-state above — the raw theme accent used in
     the card border blend (base rule further up) is tuned for a dark
     background and reads too harsh/saturated against Light Mode's cream
     --bg. Softened by mixing toward --border (light mode's already-correct
     dark-on-cream neutral) instead of the raw accent. Bumped from 20%→32%
     brand mix (was reading as barely-there) and the fade point now keeps a
     touch of --accent instead of fading to flat --border — echoes Dark
     Mode's approach of fading into the accent "family" rather than fully
     desaturating to gray, without going back to the harsh full-saturation
     look that prompted the original mute-down in the first place. */
  body.light-mode .gradient-card-wrapper {
    background: linear-gradient(135deg, color-mix(in srgb, var(--card-accent, var(--accent)) 32%, var(--border) 68%) 0%, color-mix(in srgb, var(--accent) 12%, var(--border) 88%) 60%);
  }
  body.light-mode .gradient-card-wrapper:hover {
    background: linear-gradient(135deg, color-mix(in srgb, var(--card-accent, var(--accent)) 38%, var(--border) 62%) 0%, color-mix(in srgb, var(--accent) 25%, var(--bg) 75%) 65%);
    box-shadow: 0 0 9px color-mix(in srgb, var(--card-accent, var(--accent)) 22%, var(--border) 78%);
  }
  .gradient-card-wrapper.is-hot {
    /* Was a flat 55/45 gold/accent blend. In Crimson (accent = red) that
       still reads clearly as gold against a red-tinted card. But in Cyber
       and Galaxy, every card's DEFAULT (non-hot) border is already
       tinted with that same theme accent (see the base
       .gradient-card-wrapper rule above) — so a 45%-accent hot border
       ended up too close in hue to a plain card's border, and "hot"
       became hard to distinguish by color alone.
       First attempt raised gold to 78%, but Cyber's cyan accent at that
       ratio still muddied into an olive/khaki tone (#c3bf52) rather than
       gold — cyan sits almost opposite gold on the color wheel, so even
       22% of it visibly desaturates/greys the mix. 90% gold clears that
       up across all three themes (verified: Crimson #efa82b, Cyber
       #dbb93b, Galaxy #f2ac34 — all read as clean gold) while the
       remaining 10% still keeps a faint per-theme tint. */
    --hot-color: color-mix(in srgb, #f0b428 90%, var(--accent) 10%);
    background: linear-gradient(135deg, var(--hot-color) 0%, rgba(var(--bg-glow-rgb),.6) 100%);
    /* Trimmed from 14px, and from 45% to 25% mix strength — this glow is
       always-on (not hover-only) and nearly every card in the grid is
       "hot", so at the old strength every card's glow was touching its
       neighbor's, making the whole grid look like one blurry mass instead
       of distinct cards. */
    box-shadow: 0 0 7px color-mix(in srgb, var(--hot-color) 25%, transparent);
  }
  .gradient-card-wrapper.is-hot:hover {
    box-shadow: 0 0 12px color-mix(in srgb, var(--hot-color) 45%, transparent);
  }
  /* Editor's Pick — a quiet always-on gold ring (not a resize) marking a
     small hand-picked set of sites. Scoped to :not(.is-hot) so it only
     applies to cards that are editor-picks but NOT also hot — previously
     this always won over .is-hot's box-shadow (later in source order),
     so a card that was both (e.g. KissKH, Dulo) got a visibly thicker/
     stronger border than a hot-only card like MovieBox, making the grid's
     "hot" styling look inconsistent card to card. Now every hot card
     shares the exact same border regardless of editor-pick status. */
  .gradient-card-wrapper.editor-pick:not(.is-hot) {
    box-shadow: 0 0 0 1.5px rgba(255,207,92,.6), 0 0 10px rgba(255,207,92,.2);
  }
  .gradient-card-wrapper.editor-pick:not(.is-hot):hover {
    box-shadow: 0 0 0 1.5px rgba(255,207,92,.85), 0 0 14px rgba(255,207,92,.35);
  }
  /* The dark-mode ring (pale #ffcf5c at low opacity) measured ~1:1 contrast
     against all three Light Mode pastel cards — severely fails WCAG
     1.4.11's 3:1 floor for UI component boundaries, making Editor's Picks
     essentially invisible in Light Mode. Swapped for the solid Light Mode
     --accent instead of just tweaking opacity, since no opacity of that
     pale a color could ever clear 3:1 on backgrounds this light. Resting
     state is thinner (1px) and 80% opacity rather than fully solid — a
     full 1.5px opaque ring read as visually heavy/"thick" once combined
     with a card's own base border + a filled favorite star (worst case:
     KissKH, both at once). Still verified 3.39:1+ at 80% opacity against
     all three pastel tones — comfortably above the 3:1 floor. Hover keeps
     the full-strength ring since that's a deliberate emphasis moment. */
  body.light-mode .gradient-card-wrapper.editor-pick:not(.is-hot) {
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 80%, transparent), 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  body.light-mode .gradient-card-wrapper.editor-pick:not(.is-hot):hover {
    box-shadow: 0 0 0 1.5px var(--accent), 0 0 12px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .card-content {
    background-color: #16161f;
    border-radius: var(--sp-4);
    display: flex; flex-direction: column;
    text-decoration: none; color: var(--text);
    height: 162px;
    position: relative;
    overflow: hidden;
  }
  /* Light Mode: genuinely light pastel cards (not a dark tile carried over
     from Dark Mode). This requires flipping logo text from light/white to
     dark ink — see --card-logo-ink below, referenced by .lw-white and the
     per-brand inline logoHtml colors — otherwise white-on-pastel text would
     be unreadable. Three pastel tones cycle across the grid (assigned via
     .card-pastel-blue/gold/rose in buildCard) purely for visual variety;
     Dark Mode's flat .card-content rule above is completely untouched. */
  body.light-mode {
    --card-logo-ink: #2b241d;
    --card-logo-outline: #2f5fb8;
  }
  body.light-mode .card-pastel-blue {
    background: linear-gradient(155deg, #e4e9ee 0%, #d9e0e7 100%);
    box-shadow: 0 8px 20px rgba(20,17,12,.20), inset 0 1px 0 rgba(255,255,255,.3);
  }
  body.light-mode .card-pastel-gold {
    background: linear-gradient(155deg, #e9e4d5 0%, #ded5bf 100%);
    box-shadow: 0 8px 20px rgba(20,17,12,.20), inset 0 1px 0 rgba(255,255,255,.3);
  }
  body.light-mode .card-pastel-rose {
    background: linear-gradient(155deg, #e9e0de 0%, #ddd0ce 100%);
    box-shadow: 0 8px 20px rgba(20,17,12,.20), inset 0 1px 0 rgba(255,255,255,.3);
  }
  /* --card-logo-accent/--card-logo-gold (defined in :root) were only
     tuned against the fixed dark .site-logo-box (#14141c/#262420) — but
     the SAME logoHtml/.lw-accent markup also renders inside .card-content
     (the homepage directory grid AND Favorites cards), which in Light
     Mode is a LIGHT pastel background (#e4e9ee/#e9e4d5/#e9e0de), not a
     dark one. The bright constants measured ~2.0-2.5:1 (accent) and
     ~1.1:1 (gold) there — barely visible, exactly the washed-out "Kiss"
     text reported. Scoped override with darker values that clear 4.5:1+
     against all three pastel tones; .site-logo-box lives outside
     .card-content so it's unaffected and keeps using the bright root
     values (which still pass there in both modes). */
  body.light-mode .card-content {
    --card-logo-accent: #a80f0f;
    --card-logo-gold: #6b4f05;
  }
  /* Border opacity bumped from .14 → .28: against a page background this
     close in lightness to the card tints, a faint border reads as no
     border at all — cards need a visibly darker edge (plus the shadow
     above) to actually look "lifted" rather than blending into the page.
     Other themes tint their border with the site's brand accent / theme
     accent (see the base .gradient-card-wrapper rule) — Light Mode
     originally used a completely flat neutral instead, dropping that
     visual language entirely. This brings a similar accent-corner tint
     back (25% crimson red mixed into the dark neutral, landing on a dark
     maroon rather than a bright red) so Light Mode still feels part of
     the same card language, without giving up the dark, high-contrast
     edge that keeps cards from blending into the light page.
     IMPORTANT: the second gradient stop is a translucent neutral, and
     it's the part of the ring farthest from the accent corner — it needs
     its own contrast check, not just the accent stop. At .28 opacity it
     only reached ~1.7–2.1:1 against the page/card colors, well under
     WCAG 1.4.11's 3:1 floor for UI component boundaries. Computed the
     actual opacity needed (0.54) rather than eyeballing it — verified
     3.09:1+ against every adjacent color (page bg and all 3 card tones). */
  body.light-mode .gradient-card-wrapper {
    background: linear-gradient(135deg, color-mix(in srgb, var(--card-accent, var(--accent)) 15%, #5a2927 85%) 0%, rgba(43,36,29,.54) 60%);
  }
  body.light-mode .gradient-card-wrapper:hover {
    background: linear-gradient(135deg, color-mix(in srgb, var(--card-accent, var(--accent)) 20%, #6c2b2b 80%) 0%, rgba(43,36,29,.64) 65%);
    /* Colored glow (color-mix with the theme accent) was tuned to pop
       against a near-black card — against a light pastel card it just
       looks muddy/washed out instead of reading as "lifted." A neutral
       dark shadow works as an elevation cue regardless of theme color. */
    box-shadow: 0 10px 24px rgba(20,17,12,.22);
  }
  body.light-mode .gradient-card-wrapper.is-hot {
    background: linear-gradient(135deg, var(--hot-color) 0%, color-mix(in srgb, var(--accent) 30%, var(--border) 70%) 100%);
    box-shadow: 0 6px 18px rgba(20,17,12,.18), 0 0 7px color-mix(in srgb, var(--hot-color) 30%, transparent);
  }
  body.light-mode .gradient-card-wrapper.is-hot:hover {
    box-shadow: 0 12px 28px rgba(20,17,12,.28), 0 0 12px color-mix(in srgb, var(--hot-color) 45%, transparent);
  }
  /* ===== Unified small icon-button base ===== */
  /* Shared foundation for every small action button in the app — favorite/
     pin, copy link, report, and the quick-test/reason chips. Each keeps its
     own size, border-radius, and color identity in its own rule below (they
     genuinely differ: circular icon-only vs. labeled pill); this just pulls
     the boilerplate every one of them was redeclaring — cursor, flex
     centering, default transition — into one place instead of four. */
  .pin-icon, .copy-link-btn, .quick-test-btn, .report-icon {
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .2s ease, color .2s ease, border-color .2s ease, opacity .2s ease;
  }

  .pin-icon {
    color: rgba(255,255,255,.85); cursor: pointer; transition: color .2s ease, opacity .2s ease;
    background: none; border: none; line-height: 1; padding: 0;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.6));
  }
  /* Invisible tap-area expansion — same reasoning as .report-icon::before. */
  .pin-icon::before {
    content: ''; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 44px; height: 44px;
  }
  /* The visible badge is only 16x16 (by design, so it reads as a small
     corner indicator rather than a second full-size button) — this
     invisible ::before brings its actual tap target up to WCAG 2.5.8's
     24x24px minimum without changing how it looks. */
  .theme-dropdown-arrow-btn::before {
    content: ''; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 24px; height: 24px;
  }
  .pin-icon:hover, .pin-icon.faved { color: var(--accent); }
  /* Light Mode fix: the default white-ish star (tuned for dark cards) has
     near-zero contrast against the new light pastel cards. Uses the same
     dark ink as the logo text so it reads clearly without a separate
     one-off color. */
  body.light-mode .pin-icon { color: var(--card-logo-ink); }
  body.light-mode .pin-icon:hover, body.light-mode .pin-icon.faved { color: var(--accent); }
  /* Not-yet-favorited star stays dim(mer) by default — it's a secondary,
     optional action, not something that needs equal visual weight to status
     or Hot. Bumped .78 → .9 — at .78 the outline star was still reading as
     "barely there" against busy card art, especially in Galaxy/Cyber themes. */
  .pin-icon:not(.faved) { opacity: .65; }
  .pin-icon:not(.faved):hover, .pin-icon:not(.faved):focus-visible { opacity: 1; }
  .pin-icon.faved { opacity: 1; filter: drop-shadow(0 1px 3px rgba(0,0,0,.55)) drop-shadow(0 0 4px rgba(255,207,92,.5)); }

  /* Report-broken — icon-only with a tooltip (title/aria-label carry the
     text for screen readers and on long-press/hover) instead of a labeled
     pill. Frees up footer width so the "Checked Xm ago" text has room to
     sit on one line instead of wrapping. */
  /* Kept always visible (not hover-gated) since mobile has no hover state
     to reveal it — but toned down from a solid black-pill background to a
     quiet plain icon, so it reads as the rarer/secondary action it is
     instead of visually competing 1:1 with the favorite star next to it. */
  .report-icon {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    color: rgba(255,255,255,.4); background: transparent;
    position: relative;
    font-size: .9rem; line-height: 1; letter-spacing: -1px;
  }
  .report-icon:hover, .report-icon:focus-visible { color: var(--accent); background: rgba(var(--bg-glow-rgb),.2); }
  /* Invisible tap-area expansion to meet the ~44px mobile touch target
     minimum, without changing the icon's visible 22px footprint or any
     theme color — purely an interaction-area fix. */
  .report-icon::before {
    content: ''; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 44px; height: 44px;
  }

  /* Speed badge — bolt (fast) / turtle (slow) icon, shown only when
     status.json reports timing data for a site (see getSiteSpeed()).
     display:none by default so it takes zero space for the many sites
     that don't have timing data yet; JS flips it to inline-flex only
     when there's something to show. Deliberately no background/border of
     its own — sits inline in the same status row as the (already
     contrast-verified) status text and inherits its color via
     currentColor, rather than introducing a new saturated color that
     would need its own WCAG check against every theme × mode × status-
     tint combination this row can appear in. */
  .speed-badge-mini {
    display: none; align-items: center; justify-content: center;
    flex-shrink: 0; opacity: 1;
    color: rgba(255,255,255,.95);
    filter: drop-shadow(0 0 1.5px rgba(0,0,0,.7)); /* subtle dark edge so the icon still reads against lighter/busy card backgrounds */
  }
  body.light-mode .speed-badge-mini { color: var(--card-logo-ink); filter: none; }

  /* Site status dot — filled in after status.json loads (see applyStatusDots()).
     Deliberately small and quiet (just enough contrast to read at a glance
     across a full grid) rather than a large bordered/shadowed badge — the
     status still needs to be scannable corner-to-corner, but it shouldn't
     out-shout the card content to do that. */
  .status-dot-mini {
    display: none; align-items: center; justify-content: center;
    position: absolute; top: 8px; left: 8px; z-index: 2;
    width: 17px; height: 17px;
    border-radius: 50%;
    background: rgba(8,8,16,.55);
  }
  .status-dot-mini svg { width: 68%; height: 68%; display: block; }
  /* Pinned to the left edge of the footer bar, out of the flex flow —
     "Online" + the speed icon then center together as their own pair
     across the full bar width, unaffected by the dot's position. */
  .status-label-mini .status-dot-mini {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
  }

  /* Neutral footer strip — freshness text + icon-only Report button, single
     row, single line. No per-status color here anymore; the dot above is
     the one place status lives. */
  .status-label-mini {
    display: flex; align-items: center; justify-content: center; position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    /* Small symmetric padding by default. Right padding only grows via
       .has-report (toggled in JS alongside the Report button's own
       display) on the down/blocked cards that actually show it, so a
       button nobody sees doesn't reserve dead space and skew the
       centered group on every other card. */
    padding: 7px 8px 7px 8px;
    gap: 6px;
    color: #fff;
    background: linear-gradient(0deg, rgba(0,0,0,.5), rgba(0,0,0,.05));
    transition: background .3s ease, padding .2s ease;
  }
  .status-label-mini.has-report {
    padding-right: 8px;
  }
  /* Report button pulled out of the centered dot+text group so it doesn't
     throw off the centering — sits pinned to the right edge instead. Only
     shown at all for down/blocked sites (see applyStatusDots()). */
  .status-label-mini .report-icon {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  }
  /* Light Mode: the dark gradient bar (needed on Dark Mode's near-black
     card for the white status text to read) looks like a jarring smudge
     dropped onto the new light pastel cards. A soft dark-ink wash at much
     lower opacity keeps just enough of a footer "shelf" for the status
     text without breaking the light, airy feel of the card. Status text
     switches to dark ink too (see .status-text-mini override below) since
     white-on-light-wash would no longer have enough contrast. */
  body.light-mode .status-label-mini {
    background: linear-gradient(0deg, rgba(43,36,29,.16), rgba(43,36,29,.02));
  }
  /* Without body.light-mode scoping here, the rule above (which has higher
     specificity: element+2 classes vs. just 2 classes) always won over
     .status-label-mini.status-up/.blocked/.down — so status colors never
     actually showed in Light Mode, always falling back to the plain dark
     wash regardless of real status. Scoping these to body.light-mode too
     gives them equal specificity, so source order (they come after) lets
     the real status color apply. */
  body.light-mode .status-label-mini.status-up {
    background: linear-gradient(0deg, rgba(6,214,160,.55), rgba(6,214,160,.18));
  }
  body.light-mode .status-label-mini.status-blocked {
    background: linear-gradient(0deg, rgba(240,180,40,.55), rgba(240,180,40,.18));
  }
  body.light-mode .status-label-mini.status-down {
    background: linear-gradient(0deg, rgba(230,57,70,.55), rgba(230,57,70,.18));
  }
  /* Color-coded tint once status resolves — green/gold/red wash across the
     whole bar (not just the dot) so status reads at a glance without
     needing to focus on the small icon. */
  .status-label-mini.status-up {
    background: linear-gradient(0deg, rgba(6,214,160,.5), rgba(6,214,160,.1));
  }
  .status-label-mini.status-blocked {
    background: linear-gradient(0deg, rgba(240,180,40,.5), rgba(240,180,40,.1));
  }
  .status-label-mini.status-down {
    background: linear-gradient(0deg, rgba(230,57,70,.5), rgba(230,57,70,.1));
  }
  /* Skeleton shimmer shown before status.json resolves, so the bottom bar
     never looks "broken"/empty on first paint — it visibly signals
     "checking..." instead of blank space. */
  .status-label-mini.status-loading .status-text-mini {
    display: inline-block; width: 46px; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, rgba(255,255,255,.08) 25%, rgba(255,255,255,.18) 50%, rgba(255,255,255,.08) 75%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.4s ease-in-out infinite;
  }
  .status-label-mini.status-loading .status-dot-mini {
    display: inline-flex;
    background: rgba(255,255,255,.08);
    animation: skeleton-shimmer 1.4s ease-in-out infinite;
  }
  /* White-based shimmer (tuned for the dark status bar) is invisible
     against Light Mode's now-light status bar wash — swap to a dark-ink
     based shimmer so the "checking..." loading state is still visible. */
  body.light-mode .status-label-mini.status-loading .status-text-mini {
    background: linear-gradient(90deg, rgba(38,36,32,.10) 25%, rgba(38,36,32,.22) 50%, rgba(38,36,32,.10) 75%);
    background-size: 200% 100%;
  }
  body.light-mode .status-label-mini.status-loading .status-dot-mini {
    background: rgba(38,36,32,.10);
  }
  @keyframes skeleton-shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .status-label-mini .status-text-mini {

<script>
// ========== PWA INSTALL PROMPT ==========
// Chrome/Edge/Android fire this event once the site meets installability
// criteria (manifest.json + icons + served over https). We intercept it and
// stash it instead of letting the browser show its own mini-infobar. The
// "Install app" action itself lives inside the theme dropdown menu now
// (folded in alongside Help, see toggleThemeDropdown) rather than its own
// header button — deferredInstallPrompt being non-null is what the dropdown
// checks to decide whether to show that row at all. iOS Safari never fires
// this event (no such API there), so the row simply never appears there —
// iOS users still add via native Share -> "Add to Home Screen", unchanged.
let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
});

async function triggerInstallPrompt() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice; // resolves once the user accepts/dismisses
  deferredInstallPrompt = null;
}

// Covers the case where the user installs via the browser's own UI instead
// of our menu row (e.g. they'd already dismissed it once) — keeps state in
// sync so a stale "Install app" row doesn't linger in the dropdown.
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
});

// Registering a service worker is what makes Chrome/Edge/Brave on Android
// reliably fire beforeinstallprompt — on some versions it's a hard
// installability requirement, not just a nice-to-have. sw.js now also
// caches the app shell (index.html) and serves it back when the network
// is unavailable, so the app opens to something useful instead of the
// browser's default offline error — see sw.js for what is/isn't cached.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('Service worker registration failed:', err);
    });
  });
}

// ========== iOS "ADD TO HOME SCREEN" FALLBACK ==========
// iOS Safari never fires beforeinstallprompt (Apple provides no such API),
// so our install button above never appears there. This shows a small,
// dismissible banner with manual instructions instead — otherwise iOS
// users (a large share of mobile visitors) never learn the app is
// installable at all. Dismissal is remembered per-device via localStorage,
// same pattern as the homepage safety tip.
function isIosDevice() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
function isInStandaloneMode() {
  return ('standalone' in window.navigator) && window.navigator.standalone;
}

function showIosInstallBannerIfNeeded() {
  if (!isIosDevice() || isInStandaloneMode()) return; // not iOS, or already installed
  if (localStorage.getItem('cinefind-ios-install-dismissed')) return;

  const banner = document.createElement('div');
  banner.id = 'ios-install-banner';
  banner.innerHTML = `
    <span class="ios-banner-icon">📲</span>
    <span class="ios-banner-text">Install this app: tap <strong>Share</strong> <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg> then <strong>Add to Home Screen</strong></span>
    <button class="ios-banner-close" onclick="dismissIosInstallBanner()" aria-label="Dismiss">✕</button>
  `;
  document.body.appendChild(banner);
}

function dismissIosInstallBanner() {
  localStorage.setItem('cinefind-ios-install-dismissed', '1');
  const el = document.getElementById('ios-install-banner');
  if (el) el.remove();
}

// ========== THEME TOGGLE (Crimson Dark -> Crimson Light -> Cyber -> Galaxy, via moon button) ==========
// Cyber and Galaxy are purpose-built dark/neon aesthetics (their glow effects
// need a near-black background to read correctly), so only Crimson gets a
// light variant. Light mode lives inside the same single-button cycle rather
// than a separate control, per how this site's UI is laid out.
function initTheme() {
