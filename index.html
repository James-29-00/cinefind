</head>
<body class="dark-mode theme-crimson">
<script>
  // Runs immediately (before header markup paints) so returning visitors
  // never see a flash of the full-size hero before it shrinks.
  try {
    if (localStorage.getItem('cinefind-visited')) {
      document.body.classList.add('hero-compact');
    } else {
      localStorage.setItem('cinefind-visited', '1');
    }
  } catch (e) { /* storage unavailable — hero stays full-size, no harm */ }
</script>
<div class="starfield"></div>
<div class="bg-glow"></div>
<div class="wrapper">
  <header>
    <div class="header-top">
      <button class="hamburger-menu-btn" id="hamburger-menu-btn" title="Menu" aria-label="Open menu" onclick="toggleHamburgerMenu(event)">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div id="hamburger-menu" class="hamburger-menu" style="display:none;">
        <button class="hamburger-menu-close" onclick="closeHamburgerMenu()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <button class="hamburger-menu-item" onclick="resetSearch(); closeHamburgerMenu()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </button>
        <button class="hamburger-menu-item" onclick="showFavorites(); closeHamburgerMenu()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.8 7.1-.7z"/></svg>
          My Favorites <span id="hamburger-fav-count" style="font-size:.75rem; opacity:.7;">(0)</span>
        </button>
        <button class="hamburger-menu-item" onclick="checkAdminAccess(); closeHamburgerMenu()" id="hamburger-admin-btn" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
          Admin Panel
        </button>
        <button class="hamburger-menu-item" onclick="showHelpTip(); closeHamburgerMenu()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 1.8-2 3.5"/><path d="M12 17h.01"/></svg>
          Help
        </button>
        <div class="hamburger-menu-item" style="cursor:pointer; justify-content:space-between; position:relative;" onclick="toggleThemeDropdown(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleThemeDropdown(event);}" role="button" tabindex="0" aria-haspopup="true" aria-label="Change theme">
          <span style="display:flex; align-items:center; gap:10px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            Theme <span id="theme-name-label" style="font-size:.72rem; color:var(--muted); font-weight:600; letter-spacing:.03em;"></span>
          </span>
          <div id="theme-dropdown-menu" style="display:none; position:absolute; top:100%; right:0; margin-top:8px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:6px; min-width:150px; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,.35);"></div>
        </div>
      </div>
      <!-- Visually-hidden page title: the visible "CineFind" is a clickable
           nav button (not a heading), so screen readers had no h1 at all and
           jumped straight to the h2 section headings below. This adds the
           missing top of the hierarchy without changing anything visible.
           Moved inside .header-top (was a separate sibling below it) so it
           can be a real flex item — see .logo-btn's order/flex CSS for how
           this becomes one shared row with the hamburger in compact mode,
           vs its own full-width centered line in hero mode. -->
      <h1 class="sr-only">CineFind</h1>
      <button type="button" class="logo logo-btn" onclick="resetSearch()" aria-label="CineFind — back to home">Cine<span>Find</span>
      </button>
    </div>
    <p class="tagline">Find where to watch any movie or drama — for free</p>
    <p></p>
  </header>

  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Search any movie or drama..." aria-label="Search any movie or drama" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="listbox" aria-controls="suggestions-box">
    <button class="mic-btn" id="mic-btn" onclick="startVoiceSearch()" aria-label="Search by voice" style="display:none; position:absolute; right:52px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; padding:6px; color:var(--muted);">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button class="search-btn" onclick="searchMovie()" aria-label="Search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg></button>
    <div class="suggestions-box" id="suggestions-box" role="listbox" aria-label="Search suggestions"></div>
  </div>

  <button type="button" onclick="showHelpTip()" style="display:flex; align-items:center; gap:5px; background:none; border:none; color:var(--muted); font-size:.78rem; font-weight:600; cursor:pointer; margin:4px auto var(--sp-6); padding:4px 6px;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 1.8-2 3.5"/><path d="M12 17h.01"/></svg>
    How this works
  </button>

  <div id="onboarding-banner"></div>



  <div id="recently-viewed-section"></div>

  <!-- ADVANCED FILTERS SECTION — hidden until there's a results list to filter -->
  <div class="filters" id="filters-bar" style="display:none;">
    <div class="filter-group">
      <label class="filter-label">Filter these:</label>
      <input type="text" class="filter-select" id="quick-filter-input" placeholder="Type to filter titles shown..." oninput="applyFilters()" style="width:auto; min-width:150px;">
    </div>
    <div class="filter-group">
      <label class="filter-label">Year:</label>
      <select class="filter-select" id="year-filter" onchange="applyFilters()">
        <option value="">All years</option>
        <option value="2010s">2010s</option>
        <option value="2000s">2000s</option>
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">Rating:</label>
      <select class="filter-select" id="rating-filter" onchange="applyFilters()">
        <option value="">All ratings</option>
        <option value="9">9.0+</option>
        <option value="8">8.0+</option>
        <option value="7">7.0+</option>
        <option value="6">6.0+</option>
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">Type:</label>
      <select class="filter-select" id="type-filter" onchange="applyFilters()">
        <option value="">All types</option>
        <option value="movie">Movie</option>
        <option value="series">Series</option>
      </select>
    </div>
  </div>

  <div id="result-area">
    <!-- Filled in by renderHomepage() on page load -->
  </div>

  <!-- OmniRoute debug panel — only shown when ?debug=1 is in the URL.
       Shows a live log of every OmniRoute request/response/error so you
       can confirm whether the Render/Groq backend is actually being
       reached and answering, without needing browser DevTools. -->
  <div id="omniroute-debug-panel" style="display:none; position:fixed; left:8px; right:8px; bottom:8px; max-height:40vh; overflow-y:auto; background:#0a0a0fee; border:1px solid #e63946; border-radius:10px; padding:10px 12px; font-family:monospace; font-size:11px; color:#9494b5; z-index:9999; backdrop-filter:blur(4px);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <strong style="color:#e63946;">🐛 OmniRoute debug log</strong>
      <button onclick="document.getElementById('omniroute-debug-log').innerHTML=''" style="background:none; border:1px solid #9494b5; color:#9494b5; border-radius:6px; font-size:10px; padding:2px 8px; cursor:pointer;">clear</button>
    </div>
    <div id="omniroute-debug-log"></div>
  </div>

  <button id="back-to-top-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})" aria-label="Back to top" style="display:none; position:fixed; right:16px; bottom:20px; z-index:50; width:44px; height:44px; border-radius:50%; background:var(--accent); color:#fff; border:none; box-shadow:0 4px 12px rgba(0,0,0,.35); cursor:pointer; align-items:center; justify-content:center; font-size:1.1rem;">↑</button>

  <footer>
    <p>CineFind © <span id="footer-year"></span>. This site doesn't host any content—we just help you find where to watch. Always check the legal status in your region.</p>
    <p style="margin-top:6px;"><button onclick="openAboutModal()" style="background:none; border:none; color:var(--muted); text-decoration:underline; font-size:.8rem; cursor:pointer; padding:0;">ℹ️ About & Disclaimer</button></p>
    <p id="visit-stats" style="opacity:0.7; font-size:0.85em; margin-top:4px;"></p>
    <p id="build-marker" style="opacity:0.5; font-size:0.75em; margin-top:4px;">Build: checking…</p>
  </footer>
</div>

<script src="script.js"></script>
</body>
